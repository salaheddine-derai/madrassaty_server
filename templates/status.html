<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>فحص حالة الحساب - منصة مدرستي</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style> body { font-family: 'Cairo', sans-serif; } </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col justify-between">

    <header class="border-b border-slate-800 bg-slate-900/80 backdrop-blur sticky top-0 z-50">
        <div class="max-w-6xl mx-auto px-4 py-4 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <a href="/" class="flex items-center gap-3">
                    <div class="w-10 h-10 rounded-xl bg-emerald-500/20 text-emerald-400 flex items-center justify-center font-bold text-xl border border-emerald-500/30">م</div>
                    <span class="text-xl font-extrabold text-white">منصة مدرستي</span>
                </a>
            </div>
            <div class="flex items-center gap-3 text-sm">
                <a href="/" class="px-3 py-2 rounded-lg text-slate-300 hover:text-white hover:bg-slate-800 transition">إنشاء حساب جديد</a>
                <a href="/admin" class="px-3 py-2 rounded-lg bg-slate-800 text-emerald-400 border border-slate-700 transition">لوحة الإدارة 🔒</a>
            </div>
        </div>
    </header>

    <main class="max-w-lg mx-auto px-4 py-12 w-full">
        <div class="bg-slate-800/90 rounded-2xl border border-slate-700 p-6 sm:p-8 shadow-2xl">
            <div class="text-center mb-6">
                <div class="w-12 h-12 bg-sky-500/20 text-sky-400 rounded-full flex items-center justify-center text-2xl mx-auto mb-3">
                    🔍
                </div>
                <h2 class="text-2xl font-bold text-white">فحص حالة التفعيل</h2>
                <p class="text-sm text-slate-400 mt-1">أدخل اسم المستخدم للتحقق من صلاحية وتفعيل حسابك</p>
            </div>

            <form onsubmit="checkStatus(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-300 mb-1.5">اسم المستخدم (Username)</label>
                    <input type="text" id="check_username" required placeholder="مثال: ecole_najah" dir="ltr"
                        class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-emerald-500 font-mono">
                </div>
                <button type="submit" id="btnCheck"
                    class="w-full bg-sky-600 hover:bg-sky-500 text-white font-bold py-2.5 rounded-xl shadow-lg transition">
                    فحص الحالة
                </button>
            </form>

            <!-- Result Box -->
            <div id="resultBox" class="mt-6 hidden p-4 rounded-xl border space-y-3">
                <div class="flex items-center justify-between border-b border-slate-700/60 pb-2">
                    <span class="text-xs text-slate-400">اسم المستخدم:</span>
                    <span id="res-username" class="font-bold text-white font-mono text-sm"></span>
                </div>
                <div class="flex items-center justify-between border-b border-slate-700/60 pb-2">
                    <span class="text-xs text-slate-400">النوع:</span>
                    <span id="res-type" class="font-semibold text-slate-200 text-xs"></span>
                </div>
                <div class="flex items-center justify-between border-b border-slate-700/60 pb-2">
                    <span class="text-xs text-slate-400">حالة التفعيل:</span>
                    <span id="res-status" class="font-bold text-sm px-2.5 py-0.5 rounded-full"></span>
                </div>
                <div class="flex items-center justify-between border-b border-slate-700/60 pb-2">
                    <span class="text-xs text-slate-400">تاريخ انتهاء الصلاحية:</span>
                    <span id="res-expires" class="font-bold text-slate-200 text-xs"></span>
                </div>
                <div class="flex items-center justify-between">
                    <span class="text-xs text-slate-400">حالة ربط الجهاز:</span>
                    <span id="res-device" class="text-xs font-semibold"></span>
                </div>
            </div>
        </div>
    </main>

    <footer class="border-t border-slate-800 py-6 text-center text-xs text-slate-500">
        منصة مدرستي الرقمية © 2026
    </footer>

    <script>
        async function checkStatus(e) {
            e.preventDefault();
            const username = document.getElementById('check_username').value.trim();
            if (!username) return;

            const btn = document.getElementById('btnCheck');
            btn.disabled = true;
            btn.innerText = "جاري الفحص...";

            try {
                const res = await fetch(`/api/status/${username}`);
                const data = await res.json();
                const box = document.getElementById('resultBox');
                box.classList.remove('hidden');

                if (data.found) {
                    document.getElementById('res-username').innerText = data.username;
                    document.getElementById('res-type').innerText = (data.account_type === 'school') ? '🏫 مدرسة / مؤسسة' : '👨‍🏫 أستاذ';
                    
                    const statusSpan = document.getElementById('res-status');
                    if (data.is_active && !data.is_expired) {
                        statusSpan.innerText = "مفعل ونشط ✓";
                        statusSpan.className = "font-bold text-xs px-2.5 py-0.5 rounded-full bg-emerald-500/20 text-emerald-400 border border-emerald-500/30";
                        box.className = "mt-6 p-4 rounded-xl border border-emerald-500/30 bg-emerald-500/5 space-y-3";
                    } else if (data.is_expired) {
                        statusSpan.innerText = "منتهي الصلاحية ⚠️";
                        statusSpan.className = "font-bold text-xs px-2.5 py-0.5 rounded-full bg-rose-500/20 text-rose-400 border border-rose-500/30";
                        box.className = "mt-6 p-4 rounded-xl border border-rose-500/30 bg-rose-500/5 space-y-3";
                    } else {
                        statusSpan.innerText = "بانتظار التفعيل ⏳";
                        statusSpan.className = "font-bold text-xs px-2.5 py-0.5 rounded-full bg-amber-500/20 text-amber-400 border border-amber-500/30";
                        box.className = "mt-6 p-4 rounded-xl border border-amber-500/30 bg-amber-500/5 space-y-3";
                    }

                    document.getElementById('res-expires').innerText = data.expires_at || "غير محدد";
                    
                    const devSpan = document.getElementById('res-device');
                    if (data.is_bound) {
                        devSpan.innerText = "مرتبط بجهاز نشط 🔒";
                        devSpan.className = "text-xs font-semibold text-emerald-400";
                    } else {
                        devSpan.innerText = "غير مرتبط بأي جهاز حتى الآن (متاح للربط)";
                        devSpan.className = "text-xs font-semibold text-slate-400";
                    }
                } else {
                    box.className = "mt-6 p-4 rounded-xl border border-rose-500/30 bg-rose-500/10 text-center text-sm text-rose-400";
                    box.innerHTML = "لم يتم العثور على أي حساب بهذا الاسم! تأكد من صحة الحروف.";
                }
            } catch (err) {
                alert("تعذر الاتصال بالسيرفر: " + err);
            } finally {
                btn.disabled = false;
                btn.innerText = "فحص الحالة";
            }
        }
    </script>
</body>
</html>
